<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .recipe-card {
            transition: transform 0.2s ease-in-out, shadow 0.2s;
            border-radius: 12px;
            overflow: hidden;
        }
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
        .recipe-img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Main header container -->
    <header class="bg-primary text-white text-center py-4 mb-4 shadow-sm">
        <h1 class="fw-bold"><i class="fa-solid fa-utensils me-2"></i>Recipe Finder</h1>
        <p class="mb-0">Search delicious recipes by selecting your favorite ingredient</p>
    </header>

    <!-- Controls and search container -->
    <div class="container">
        <div class="row justify-content-center mb-5">
            <div class="col-md-6">
                <!-- Dropdown selection for recipe categories -->
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                    <select id="userSelect" class="form-select border-start-0 py-2" onchange="getRecipes(this.value)">
                        <!-- Dynamic options loaded from JavaScript -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Recipe cards layout grid -->
        <div id="recipesContainer" class="row g-4 mb-5">
            <!-- Dynamic recipe cards rendered here -->
        </div>
    </div>

    <!-- External JavaScript file linkage -->
    <script src="./javascript/script.js"></script>
</body>
</html>
