<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .todo-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
        }
        .task-item {
            border: none;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            background: transparent;
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
        }
        .edit-btn { color: #fd7e14; }
        .delete-btn { color: #adb5bd; }
        .edit-btn:hover { color: #e8590c; }
        .delete-btn:hover { color: #495057; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <!-- To-Do list main card container -->
    <div class="card todo-card p-4 shadow-sm border-0">
        <h5 class="text-center fw-bold mb-4 text-dark">My To-Do List</h5>

        <!-- Input field and add button group -->
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control form-control-sm" placeholder="Add a new task . .">
            <button class="btn btn-primary btn-sm px-3" type="button" onclick="addTask()">Add</button>
        </div>

        <!-- Task list container -->
        <ul id="taskList" class="list-group list-group-flush p-0 m-0">
        </ul>
    </div>

    <script src="./javascript/script.js"></script>
</body>
</html>
