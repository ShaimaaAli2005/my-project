<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>
    
    <!-- Link Bootstrap CSS for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Base page styling */
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding-top: 20px;
        }

        /* Styling for the dropdown container */
        .search-container {
            max-width: 500px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        /* Styling for recipe cards */
        .recipe-card {
            border: none;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
            height: 100%; /* Ensure all cards have equal height */
        }

        /* Add hover effect to cards */
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1) !important;
        }

        /* Standardize recipe image height and fit */
        .recipe-img {
            height: 200px;
            object-fit: cover;
        }

        /* Center text and add padding to card body */
        .card-body {
            padding: 15px;
            text-align: center;
            display: flex;
            flex-column: justify-content;
        }

        /* Styling for recipe title */
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        /* Styling for publisher text */
        .card-text {
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Search and selection area -->
        <div class="search-container shadow-sm p-3 bg-white rounded">
            <h4 class="mb-3 text-primary">Find Your Recipe</h4>
            <select id="userSelect" class="form-select" onchange="getRecipes(this.value)">
                <!-- Options will be populated here by JavaScript -->
            </select>
        </div>

        <!-- Grid to display recipe cards -->
        <div id="recipesContainer" class="row g-4 mb-5">
        </div>
    </div>
    <script src="./javascript/script.js"></script>
</body>
</html>
