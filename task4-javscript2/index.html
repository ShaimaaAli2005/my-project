<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD System</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .main-card {
            max-width: 900px;
            margin: auto;
            border-radius: 12px;
        }
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <!-- Product management form container -->
        <div class="card main-card shadow-sm border-0 p-4 mb-4">
            <h2 class="text-center fw-bold mb-4 text-dark">CRUD SYSTEM</h2>

            <form id="productForm">
                <!-- Product name input -->
                <div class="mb-3">
                    <label for="productName" class="form-label font-semibold">Product Name</label>
                    <input type="text" id="productName" class="form-control" placeholder="Enter product name">
                </div>

                <!-- Product price input -->
                <div class="mb-3">
                    <label for="productPrice" class="form-label">Product Price</label>
                    <input type="number" id="productPrice" class="form-control" placeholder="Enter product price">
                </div>

                <!-- Product category input -->
                <div class="mb-3">
                    <label for="productCategory" class="form-label">Product Category</label>
                    <input type="text" id="productCategory" class="form-control" placeholder="Enter product category">
                </div>

                <!-- Product description input -->
                <div class="mb-3">
                    <label for="productDescription" class="form-label">Product Description</label>
                    <textarea id="productDescription" class="form-control" rows="2" placeholder="Enter description"></textarea>
                </div>

                <!-- Product image input -->
                <div class="mb-4">
                    <label for="productImage" class="form-label">Product Image</label>
                    <input type="file" id="productImage" class="form-control" accept="image/*">
                </div>

                <!-- Submit button -->
                <button type="button" id="submitBtn" class="btn btn-primary px-4" onclick="handleProductSubmit()">Add Product</button>
            </form>
        </div>

        <!-- Search and table container -->
        <div class="card main-card shadow-sm border-0 p-4">
            <!-- Search bar input -->
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" placeholder="Search By Name..." onkeyup="searchProduct(this.value)">
            </div>

            <!-- Products data display table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Index</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Update</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Dynamic rows loaded from JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- External JavaScript linkage -->
    <script src="./javascript/script.js"></script>
</body>
</html>
